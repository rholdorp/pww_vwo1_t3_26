      # geseed uit huidige screenshots — bevestigen + aanvullen do 2026-06-04
      - id: h1-skelet
        bron: "Hoofdstuk 1 — Het skelet"
        gefotografeerd: true
        geextraheerd: false
        gevalideerd: false

  aardrijkskunde:
