    scope:
      - id: paragrafen-5.1-6.1
        bron: "H5 §5.1, 5.2, 5.3 (alleen 'De bekering van Clovis'), 5.4 (p92-107) + H6 §6.1 (p116-119). §5.5/verdieping/oriëntatie buiten scope."
