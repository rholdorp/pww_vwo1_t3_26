# SCOPE-CHECKLIST (completeness-gate, zie SPEC §4 + P8)
# Een vak is pas `compleet` (en wordt pas als vertrouwd in de app getoond) als ELK
# scope-item alle drie de vinkjes heeft: gefotografeerd + geextraheerd + gevalideerd.
# De scope-lijst (welke stof toetsbaar is) komt van Stijn/docent.
# >>> frans/geschiedenis/nederlands/aardrijkskunde: scope vastgelegd uit officiële
#     docentinfo (PWW-detailschermen). wiskunde: scope vastgelegd uit foto-inventory
#     (raw/wiskunde/inventory.md, H8+H9 compleet). aardrijkskunde: foto's binnen
#     (H6 §1-3, H5 §5.2, topo 5.2), nog te extraheren.
#     engels: scope vastgelegd 2026-06-10 uit officiële docentinfo (agenda-afspraak
#     "PW Engels"), nog géén screenshots. <<<
# ===== SCOPE-AUDIT 2026-06-07 (status per vak) =====
#   gevalideerd is OVERAL nog false (validator-grounding niet gewired) → géén vak
#   geldt als "vertrouwd compleet". Eerlijke dekking-status:
#   - engels      : VOLLEDIG UIT BOEK. Scope vastgelegd (2026-06-10), nog geen
#                   screenshots/trainer. LET OP: eerste toets (ma 29/6).
#   - biologie    : VOLLEDIG UIT BOEK. 35 screenshots binnen, nog niet verwerkt (geen trainer).
#   - wiskunde    : H8 CAT-2-TRAINER LIVE (2026-06-10). Voorkennis+§8.1–8.5 geextraheerd:true
#                   (312 geverifieerde opgaven + 15 regel-flashcards; §8.5 toegevoegd 2026-06-12:
#                   125 opgaven + 7 kaarten), gevalideerd:false. Binair-onderzoek en de H9-opgaven
#                   buiten §9.3 (hoeken) nog geextraheerd:false (volgende slag).
#   - geschiedenis: COMPLEET (2026-06-07, door Ralph/Stijn nagekeken). Begrippen +
#                   jaartallen + vaardigheden (tijdvakken/periodes, chronologie, tijdbalk,
#                   soorten geschiedenis, betrouwbaarheid). De eerder genoemde "7 ontbrekende
#                   vaardigheden" (bronnen/oorzaak-gevolg/feit-mening) waren een hallucinatie:
#                   die stof staat niet in dit boek/deze scope — geschrapt.
#   - frans       : GATEN. Werkwoorden/vraagstelling/hoofdstukverhaal gedekt; woordenlijst is
#                   subset, NIET geverifieerd tegen p78/79 (kan ontbrekende woorden hebben).
#   - aardrijkskunde: GEDEKT, niet gevalideerd. H5 §5.2 + H6 §1–3 + topografie.
#   - nederlands  : GEDEKT, niet gevalideerd. Informele brief (3 opdrachten, Cat 4 schrijftrainer).
#   App toont (bewust) nog geen per-vak dekking-banner — alleen één globale
#   "nog niet gevalideerd"-waarschuwing + voetnoot over boek-only vakken (Ralph 2026-06-07).
# ====================================================
# LET OP frans: per 2026-06-06 CH6-materiaal binnen vanuit twee kanten:
#   - foto's (Mara): vocab A/B p78, E/F p79, passé composé regarder, vraag stellen +
#     vraagwoorden, aller futur proche (p83).
#   - aanvullend (Stijn): verbes-docx (40 NL↔FR werkw.) + hoofdstukverhaal-pdf
#     (faire/aller présent-tabellen). Verwerkt naar vocab.json (60 items),
#     werkwoorden.json (36 vervoegingen), hoofdstukverhaal.md.
# CH5-vocab.json hernoemd naar vocab-ch5-offscope.json (blijft bewaard, telt NIET
# voor PWW). Nog nodig: présent van avoir/être, re-extract vocab vanuit p78/79,
# passé composé sync met regarder-table, extract grammaire 3+4 uit foto's.

vakken:
  wiskunde:
    primaire_categorie: 2
    secundaire_categorie: 1   # cat 1 voor formules/begrippen/eigenschappen (automatiseer voor cat 2 toepassing)
    moeilijkheid: 3
    methode: "Getal & Ruimte"
    # Scope: hele H8 + H9. Per paragraaf 1 scope-item; Cat. 1 (formules/begrippen)
    # en Cat. 2 (opgaven) komen beide uit dezelfde theorie- en opgavenblokken.
    # Detailoverzicht van onderdelen-per-paragraaf in
    # raw/wiskunde/inventory.md (27 onderdelen totaal).
    scope:
      # 2026-06-10: Cat-2-trainer H8 gebouwd (trainers/wiskunde/opgaven.json) + regel-
      # flashcards (flashcards.json), alle Q→A door berekening geverifieerd.
      # 2026-06-12: §8.5 toegevoegd (125 opgaven, opg 60–85 + L10–L12, + 7 regelkaarten)
      # → geextraheerd:true voor Voorkennis + §8.1–§8.5 (totaal 312 opgaven). De bijlage-
      # foto's dekken wél heel H8 (opg 55+ op PXL_…064343217/064345600.MP); de oude notitie
      # "A55/L8 geen antwoord-scan" was achterhaald. Opg 37 (geen vraag-scan) wacht nog op
      # herscan. BEWUST NIET opgenomen (eerlijk gevlagd, zie docs/BACKLOG.md): figuur-opgaven
      # (oppervlakte/omtrek, priemfactor-figuur, 65 piramide, 67 kubus), woordproblemen/open
      # vragen (66a, 73, E76 dubbel-invul), opgaven met breuk-coëfficiënt-antwoorden
      # (matcher-onveilig, o.a. 84a) en antwoorden die in het boek een tekening/uitwerking zijn.
      # gevalideerd blijft OVERAL false (validator-grounding niet gewired) → vak niet "live".
      - id: h8-voorkennis
        bron: "H8 Voorkennis 'Rekenen met letters' (p104)"
        gefotografeerd: true
        geextraheerd: true
        gevalideerd: false
      - id: h8-paragraaf-1-herleiden
        bron: "§8.1 Herleiden (p105-106). Onderdelen: §8.1a herleiden en rekenvolgorde."
        gefotografeerd: true
        geextraheerd: true
        gevalideerd: false
      - id: h8-paragraaf-2-haakjes
        bron: "§8.2 Haakjes wegwerken (p107-113). Onderdelen: a(b+c)=ab+ac, minteken, herleiden+haakjes, toepassing."
        gefotografeerd: true
        geextraheerd: true
        gevalideerd: false
      - id: h8-paragraaf-3-machten
        bron: "§8.3 Machten (p114-119). Onderdelen: grondtal+exponent, rekenen, negatief grondtal, toepassing."
        gefotografeerd: true
        geextraheerd: true
        gevalideerd: false
      - id: h8-paragraaf-4-wetenschappelijke-notatie
        bron: "§8.4 Wetenschappelijke notatie (p120-124). Onderdelen: rekenmachine, schrijven/lezen."
        gefotografeerd: true
        geextraheerd: true
        gevalideerd: false
      - id: h8-paragraaf-5-machten-en-letters
        bron: "§8.5 Machten en letters (p125-131). Onderdelen: vermenigvuldigen, som/verschil, delen."
        gefotografeerd: true
        geextraheerd: true
        gevalideerd: false
      - id: h8-onderzoek-binair
        bron: "Onderzoek 'Het binaire stelsel' (p143-145). Extensie — optioneel voor toets."
        gefotografeerd: true
        geextraheerd: false
        gevalideerd: false
      # 2026-06-10: H9 CONCEPT-flashcards gebouwd (37 kaarten §9.1–9.5 in flashcards.json,
      # getrouw uit de theorie). De NUMERIEKE hoek-opgaven (Cat-2, met figuur) zijn nog NIET
      # geëxtraheerd → geextraheerd blijft per saldo false tot ook de opgaven + figuren erin
      # zitten (zie docs/BACKLOG.md). gevalideerd overal false.
      - id: h9-voorkennis
        bron: "H9 Voorkennis Loodlijnen (p147)"
        gefotografeerd: true
        geextraheerd: false
        gevalideerd: false
      - id: h9-paragraaf-1-lijnsymmetrie
        bron: "§9.1 Lijnsymmetrie (p148-153). Onderdelen: spiegelen herkennen, spiegelbeeld tekenen."
        gefotografeerd: true
        geextraheerd: false
        gevalideerd: false
      - id: h9-paragraaf-2-draaisymmetrie
        bron: "§9.2 Draaisymmetrie + Puntsymmetrie (p154-160). Onderdelen: draaisymmetrie, draaiingshoek, puntsymmetrie."
        gefotografeerd: true
        geextraheerd: false
        gevalideerd: false
      - id: h9-paragraaf-3-bijzondere-driehoeken
        bron: "§9.3 Bijzondere driehoeken (p161-168). Onderdelen: classificeren, hoeken in gelijkbenige, hoeken in figuren."
        gefotografeerd: true
        geextraheerd: false
        gevalideerd: false
      - id: h9-paragraaf-4-bijzondere-vierhoeken
        bron: "§9.4 Bijzondere vierhoeken (p169-174). Onderdelen: parallelogram, ruit, trapezium+vlieger."
        gefotografeerd: true
        geextraheerd: false
        gevalideerd: false
      - id: h9-paragraaf-5-z-en-f-hoeken
        bron: "§9.5 Z-hoeken en F-hoeken (p175-184). Onderdelen: Z-hoeken, F-hoeken, hoeken met evenwijdige lijnen."
        gefotografeerd: true
        geextraheerd: false
        gevalideerd: false

