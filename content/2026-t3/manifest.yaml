        # DEELS: betrouwbaarheid (p94) + chronologie/tijdbalk (p112) gefotografeerd+geëxtraheerd.
        # De overige vaardigheden-definities staan in het vaardigheden-overzicht ("p10-11"
        # docentinfo) — NIET gefotografeerd. Die pagina's nog nodig voor volledige dekking.
        gefotografeerd: false
        geextraheerd: false
        gevalideerd: false

