        # gefotografeerd: true (Mara's PXL p78+p79).
        # geextraheerd: true (60 items in vocab.json), MAAR uit verbes-docx + verhaal-bold,
        # niet uit p78/p79 zelf — needs re-extract om dekkings-claim te valideren.
        gefotografeerd: true
        geextraheerd: true
        gevalideerd: false
      - id: grammaire-er-werkwoorden
        bron: "Grammaire 1: -ER-werkwoorden vertalen + in présent + passé composé plaatsen (GRAMMAIRE-kader passé composé met regarder, Mara's foto PXL_20260606_154403392.jpg)"
