<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" class="anat-svg" aria-label="Skelet — voor- en zijaanzicht">
  <defs>
    <style>
      .body-bg { fill:#fef3f2; stroke:#fbcfe8; stroke-width:1; }
      .bone    { fill:#f8fafc; stroke:#475569; stroke-width:1.3; }
      .feature { fill:#475569; }
      .label   { font: 600 9px sans-serif; fill:#475569; text-anchor:middle; pointer-events:none; }
      .heading { font: 700 12px sans-serif; fill:#0f172a; text-anchor:middle; pointer-events:none; }
      .region  { cursor:pointer; }
      .hit     { fill:rgba(0,0,0,0); stroke:none; pointer-events:all; }
      .region:hover .bone      { fill:#fef9c3; }
      .region:hover .hit       { fill:rgba(254,240,138,0.25); }
      .region.correct .bone    { fill:#bbf7d0; stroke:#16a34a; stroke-width:2; }
      .region.wrong   .bone    { fill:#fecaca; stroke:#dc2626; stroke-width:2; }
      .region.hint    .bone    { fill:#bfdbfe; stroke:#2563eb; stroke-width:2; }
      .region.correct .hit, .region.wrong .hit, .region.hint .hit { fill:rgba(0,0,0,0); }
    </style>
  </defs>

  <!-- ======================= VOORAANZICHT (links) ======================= -->
  <text class="heading" x="110" y="14">vooraanzicht</text>
  <g class="silhouette" pointer-events="none">
    <ellipse class="body-bg" cx="110" cy="50"  rx="40" ry="44"/>
    <rect    class="body-bg" x="48"  y="92"   width="124" height="160" rx="30"/>
    <rect    class="body-bg" x="18"  y="108"  width="40"  height="200" rx="18"/>
    <rect    class="body-bg" x="162" y="108"  width="40"  height="200" rx="18"/>
    <rect    class="body-bg" x="60"  y="240"  width="44"  height="350" rx="20"/>
    <rect    class="body-bg" x="116" y="240"  width="44"  height="350" rx="20"/>
  </g>

  <!-- Schedel-omtrek als referentie (geen region zelf) -->
  <ellipse class="bone" cx="110" cy="50" rx="34" ry="38" pointer-events="none" opacity="0.0"/>

  <!-- Voorhoofdsbeen -->
  <g class="region" data-region="r-voorhoofdsbeen">
    <title>voorhoofdsbeen</title>
    <rect class="hit" x="74" y="14" width="72" height="22"/>
    <path class="bone" d="M78,32 Q110,8 142,32 L142,40 Q110,30 78,40 Z"/>
  </g>

  <!-- Wandbeen (zijkanten/bovenkant boven oren) -->
